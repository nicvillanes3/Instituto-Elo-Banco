<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento com Boleto</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Grade de pontos decorativa */
        .pontos {
            background-image: radial-gradient(circle at 3px 3px, #3b82f6 3px, transparent 3.3px);
            background-size: 14px 14px;
        }

        @media print {
            body > *:not(.area-impressao) { display: none !important; }
        }
    </style>
</head>
<body class="bg-white min-h-screen relative overflow-x-hidden flex flex-col justify-between py-6 px-4 md:px-12">

    <div id="toast" class="fixed top-5 right-5 z-50 transform -translate-y-40 opacity-0 transition-all duration-300 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        <span id="toastMensagem" class="text-sm font-medium"></span>
    </div>

    <div class="absolute top-24 left-[-60px] w-64 h-64 bg-blue-50 rounded-full blur-xl pointer-events-none -z-10"></div>
    <div class="absolute bottom-[-30px] left-[-20px] w-32 h-32 bg-yellow-400 rounded-full pointer-events-none -z-10"></div>
    <div class="absolute bottom-44 left-32 w-3.5 h-3.5 bg-blue-600 rounded-full pointer-events-none -z-10"></div>

    <div class="pontos absolute top-32 left-4 w-[46px] h-[62px] opacity-30 pointer-events-none -z-10"></div>
    <div class="pontos absolute bottom-10 left-4 w-[46px] h-[34px] opacity-30 pointer-events-none -z-10"></div>
    <div class="pontos absolute top-2 right-4 w-[46px] h-[48px] opacity-30 pointer-events-none -z-10"></div>
    <div class="pontos absolute bottom-2 right-4 w-[46px] h-[34px] opacity-30 pointer-events-none -z-10"></div>

    <div class="absolute top-28 right-[-50px] w-80 h-80 bg-yellow-400 rounded-full pointer-events-none -z-10"></div>
    <div class="absolute top-28 right-12 w-3.5 h-3.5 bg-blue-600 rounded-full pointer-events-none -z-10"></div>

    <div class="max-w-5xl mx-auto w-full my-auto area-impressao">

        <div class="mb-4">
            <a href="projeto.html" data-voltar class="inline-flex items-center text-blue-600 font-semibold text-sm hover:underline gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
                Voltar
            </a>
        </div>

        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-1">Pagamento com Boleto</h1>
        <p class="text-xs text-gray-400 mb-8">Pague até a data do vencimento em qualquer banco ou casa lotérica.</p>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

            <div class="lg:col-span-7 bg-white border border-gray-100 rounded-2xl shadow-sm p-6 md:p-8">
                <h2 class="text-base font-bold text-gray-900 mb-6">Boleto bancário</h2>

                <!-- Código de barras (as barras são desenhadas pelo script abaixo) -->
                <div class="w-full flex justify-center mb-6 overflow-hidden">
                    <svg id="codigoBarras" class="w-full max-w-md h-16" viewBox="0 0 400 80" preserveAspectRatio="none"></svg>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-500 mb-2">Linha digitável</label>
                    <input type="text" id="barcodeValue" readonly value="00190.00009 03123.373737 00000.010009 3" class="w-full text-xs md:text-sm font-medium text-gray-600 bg-gray-50 border border-gray-200 rounded-xl p-3.5 focus:outline-none select-all">
                </div>

                <div class="mb-8">
                    <button onclick="copyBoletoCode()" class="inline-flex items-center gap-2 border border-blue-200 bg-blue-50/30 hover:bg-blue-50 text-blue-600 font-semibold text-xs py-2.5 px-4 rounded-xl transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        <span id="copyBtnText">Copiar código</span>
                    </button>
                </div>

                <div class="flex flex-wrap items-center gap-4 pt-4 border-t border-gray-100">
                    <button onclick="baixarBoleto()" class="flex-1 min-w-[140px] inline-flex items-center justify-center gap-2 border border-blue-200 bg-white hover:bg-gray-50 text-blue-600 font-semibold text-xs py-3 px-4 rounded-xl transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Baixar boleto (PDF)
                    </button>
                </div>
            </div>

            <div class="lg:col-span-5 bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
                <div class="h-36 w-full overflow-hidden">
                    <img data-imagem src="" alt="" class="w-full h-full object-cover">
                </div>

                <div class="p-6">
                    <h3 class="text-sm font-bold text-gray-900 mb-1">Resumo do projeto</h3>
                    <h4 class="text-xs font-bold text-gray-800" data-campo="projeto"></h4>
                    <p class="text-xs text-gray-400 mb-6" data-campo="org"></p>

                    <div class="border-t border-gray-100 pt-4 mb-4">
                        <div class="grid grid-cols-2 gap-4 mb-3">
                            <div>
                                <span class="block text-xs font-bold text-gray-800">Sua doação</span>
                                <span class="text-xs text-gray-500" data-campo="valor"></span>
                            </div>
                            <div>
                                <span class="block text-xs font-bold text-gray-800">Vencimento</span>
                                <span class="text-xs text-gray-500" data-campo="vencimento"></span>
                            </div>
                        </div>

                        <div>
                            <span class="block text-xs font-bold text-gray-800 mb-0.5">Após o vencimento</span>
                            <p class="text-[11px] text-gray-400">O boleto poderá ser emitido novamente.</p>
                        </div>
                    </div>

                    <div class="border-t border-gray-100 pt-4">
                        <span class="block text-xs font-bold text-gray-800">Apoiadora</span>
                        <span class="text-xs text-gray-500" data-campo="apoiador"></span>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <div class="text-center pt-8 pb-2">
        <p class="text-xs text-gray-500 inline-flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
            Precisa de ajuda? Fale com nosso <a href="#" class="text-blue-600 font-medium hover:underline">suporte</a>
        </p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="dadosProjetos.js"></script>
    <script src="pagamento.js"></script>
    <script>
        // Desenha as barras do código de barras: [posição x, largura]
        const barras = [[0,4],[6,2],[12,6],[22,2],[28,8],[40,4],[48,2],[54,6],[64,4],[72,2],[78,8],[90,2],[96,6],[106,4],[114,2],[120,8],[132,2],[138,4],[146,6],[156,2],[162,8],[174,4],[182,2],[188,6],[198,2],[204,8],[216,4],[224,2],[230,6],[240,2],[246,8],[258,4],[266,2],[272,6],[282,4],[290,2],[296,8],[308,2],[314,6],[324,4],[332,2],[338,8],[350,2],[356,6],[366,4],[374,2],[380,8],[392,4],[398,2]];

        document.getElementById('codigoBarras').innerHTML = barras
            .map(([x, largura]) => `<rect x="${x}" width="${largura}" height="80" fill="#000"/>`)
            .join('');

        function copyBoletoCode() {
            const input = document.getElementById('barcodeValue');
            input.select();

            navigator.clipboard.writeText(input.value).then(() => {
                document.getElementById('copyBtnText').textContent = 'Copiado!';
                mostrarAviso('Código copiado com sucesso!');

                // vai para a página de doação concluída levando projeto e valor
                concluirPagamento('boleto', 5000);
            }).catch(() => {
                mostrarAviso('Não foi possível copiar o código.');
            });
        }

        function mostrarAviso(mensagem) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMensagem').textContent = mensagem;
            toast.classList.remove('-translate-y-40', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
        }

        function baixarBoleto() {
            if (!window.jspdf) {
                alert("Não foi possível carregar a biblioteca para gerar o PDF. Verifique sua conexão com a internet.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();

            const pegarTexto = (campo) =>
                document.querySelector(`[data-campo="${campo}"]`)?.textContent.trim() || "Não informado";

            const valor = pegarTexto("valor");
            const projeto = pegarTexto("projeto");
            const organizacao = pegarTexto("org");
            const vencimento = pegarTexto("vencimento");
            const apoiador = pegarTexto("apoiador");
            const codigo = document.getElementById("barcodeValue").value;

            pdf.setFont("helvetica", "bold");
            pdf.setFontSize(20);
            pdf.text("ELO - BOLETO", 20, 25);

            pdf.setFont("helvetica", "normal");
            pdf.setFontSize(11);
            pdf.text("Comprovante de dados para pagamento", 20, 35);

            pdf.setDrawColor(210, 220, 235);
            pdf.line(20, 42, 190, 42);

            pdf.setFont("helvetica", "bold");
            pdf.text("Projeto:", 20, 55);
            pdf.setFont("helvetica", "normal");
            pdf.text(pdf.splitTextToSize(projeto, 150), 20, 63);

            pdf.setFont("helvetica", "bold");
            pdf.text("Organização:", 20, 82);
            pdf.setFont("helvetica", "normal");
            pdf.text(pdf.splitTextToSize(organizacao, 150), 20, 90);

            pdf.setFont("helvetica", "bold");
            pdf.text("Valor da doação:", 20, 108);
            pdf.setFont("helvetica", "normal");
            pdf.text(valor, 65, 108);

            pdf.setFont("helvetica", "bold");
            pdf.text("Vencimento:", 20, 120);
            pdf.setFont("helvetica", "normal");
            pdf.text(vencimento, 55, 120);

            pdf.setFont("helvetica", "bold");
            pdf.text("Apoiador(a):", 20, 132);
            pdf.setFont("helvetica", "normal");
            pdf.text(pdf.splitTextToSize(apoiador, 140), 20, 140);

            pdf.setFont("helvetica", "bold");
            pdf.text("Linha digitável:", 20, 160);
            pdf.setFont("helvetica", "normal");
            pdf.setFontSize(10);
            pdf.text(pdf.splitTextToSize(codigo, 165), 20, 170);

            pdf.setFontSize(9);
            pdf.text("Documento demonstrativo gerado pela plataforma Elo.", 20, 200);
            pdf.text("Este arquivo não substitui um boleto bancário emitido por uma instituição financeira.", 20, 207);

            pdf.save("boleto-elo.pdf");
            mostrarAviso('Boleto baixado: boleto-elo.pdf');

            // vai para a página de doação concluída levando projeto e valor
            concluirPagamento('boleto', 5000);
        }
    </script>
</body>
</html>
