<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento com cartão</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#0052FF',
                        brandBlueHover: '#0043D6',
                        brandBlueLight: '#EBF2FF',
                        brandYellow: '#FFDC00',
                        brandDark: '#0F172A',
                        brandGrayText: '#64748B',
                        brandBorder: '#E2E8F0'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .bg-shape-left {
            position: absolute;
            width: 280px;
            height: 480px;
            left: -100px;
            top: 20%;
            background: linear-gradient(135deg, rgba(219, 234, 254, 0.7) 0%, rgba(239, 246, 255, 0.4) 100%);
            border-radius: 50%;
            filter: blur(10px);
            z-index: 0;
            pointer-events: none;
        }

        .bg-shape-right-top {
            position: absolute;
            width: 320px;
            height: 320px;
            right: -80px;
            top: -60px;
            background: rgba(219, 234, 254, 0.6);
            border-radius: 50%;
            filter: blur(8px);
            z-index: 0;
            pointer-events: none;
        }

        .bg-shape-right-bottom {
            position: absolute;
            width: 260px;
            height: 260px;
            right: -60px;
            bottom: 10%;
            background: rgba(219, 234, 254, 0.6);
            border-radius: 50%;
            filter: blur(8px);
            z-index: 0;
            pointer-events: none;
        }

        /* Padrão de pontos decorativo em SVG CSS */
        .dot-pattern {
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 12px 12px;
        }
    </style>
</head>
<body class="bg-white min-h-screen font-sans text-slate-800 antialiased relative overflow-x-hidden flex items-center justify-center py-10 px-4">

    <div id="toast" class="fixed top-5 right-5 z-50 transform -translate-y-40 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toast-message" class="text-sm font-medium">Processando...</span>
    </div>

    <div class="bg-shape-left"></div>
    <div class="bg-shape-right-top"></div>
    <div class="bg-shape-right-bottom"></div>

    <div class="absolute top-1/4 right-[2%] w-32 h-32 lg:w-40 lg:h-40 bg-brandYellow rounded-full z-0"></div>
    <div class="absolute bottom-[22%] left-[2%] w-20 h-20 lg:w-24 lg:h-24 bg-brandYellow rounded-full z-0"></div>

    <div class="absolute top-[21%] right-[11%] w-5 h-5 bg-brandBlue rounded-full z-0"></div>
    <div class="absolute bottom-[35%] left-[9%] w-5 h-5 bg-brandBlue rounded-full z-0"></div>
    <div class="absolute bottom-[7%] left-[51%] w-5 h-5 bg-brandBlue rounded-full z-0"></div>

    <div class="absolute top-4 right-6 w-28 h-28 dot-pattern opacity-60 pointer-events-none"></div>
    <div class="absolute top-[18%] left-4 w-20 h-28 dot-pattern opacity-60 pointer-events-none"></div>
    <div class="absolute bottom-6 left-4 w-20 h-32 dot-pattern opacity-60 pointer-events-none"></div>
    <div class="absolute bottom-2 right-4 w-28 h-32 dot-pattern opacity-60 pointer-events-none"></div>

    <main class="w-full max-w-xl mx-auto relative z-10 my-auto">

        <a href="projeto.html" data-voltar class="inline-flex items-center text-sm font-semibold text-brandBlue hover:text-blue-700 mb-6 transition-colors">
            <i class="fa-solid fa-arrow-left mr-2"></i>
            Voltar
        </a>

        <div class="mb-6">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Pagamento com cartão</h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-1 font-medium">Preencha os dados do seu cartão.</p>
        </div>

        <form onsubmit="handleSubmit(event)" class="space-y-5">

            <div>
                <label for="cardNumber" class="block text-sm font-bold text-slate-900 mb-2">Número do cartão</label>
                <div class="relative flex items-center">
                    <input
                        type="text"
                        id="cardNumber"
                        placeholder="0000 0000 0000 0000"
                        maxlength="19"
                        required
                        oninput="formatCardNumber(this)"
                        class="w-full bg-slate-50/50 border border-slate-200 rounded-xl py-3.5 pl-4 pr-28 text-slate-800 placeholder-slate-300 text-sm font-medium focus:outline-none focus:border-brandBlue focus:bg-white transition-all shadow-sm"
                    >
                    <div class="absolute right-3.5 flex items-center space-x-1.5 pointer-events-none">
                        <div class="h-6 w-9 flex items-center justify-center bg-white border border-slate-100 rounded px-1">
                            <svg class="h-4 w-7" viewBox="0 0 38 24" fill="none">
                                <circle cx="15" cy="12" r="10" fill="#EB001B"/>
                                <circle cx="23" cy="12" r="10" fill="#F79E1B" fill-opacity="0.9"/>
                            </svg>
                        </div>
                        <div class="h-6 w-11 flex items-center justify-center bg-white border border-slate-100 rounded px-1">
                            <span class="font-extrabold text-indigo-900 italic text-xs tracking-tighter">VISA</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3.5">
                <div class="sm:col-span-6">
                    <label for="cardName" class="block text-sm font-bold text-slate-900 mb-2">Nome no cartão</label>
                    <input
                        type="text"
                        id="cardName"
                        placeholder="Como está escrito no cartão"
                        required
                        class="w-full bg-slate-50/50 border border-slate-200 rounded-xl py-3.5 px-4 text-slate-800 placeholder-slate-300 text-sm font-medium focus:outline-none focus:border-brandBlue focus:bg-white transition-all shadow-sm"
                    >
                </div>

                <div class="sm:col-span-3">
                    <label for="expiry" class="block text-sm font-bold text-slate-900 mb-2">Validade</label>
                    <input
                        type="text"
                        id="expiry"
                        placeholder="MM / AA"
                        maxlength="7"
                        required
                        oninput="formatExpiry(this)"
                        class="w-full bg-slate-50/50 border border-slate-200 rounded-xl py-3.5 px-3 text-center text-slate-800 placeholder-slate-300 text-sm font-medium focus:outline-none focus:border-brandBlue focus:bg-white transition-all shadow-sm"
                    >
                </div>

                <div class="sm:col-span-3">
                    <label for="cvv" class="block text-sm font-bold text-slate-900 mb-2">CVV</label>
                    <input
                        type="text"
                        id="cvv"
                        placeholder="123"
                        maxlength="4"
                        required
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                        class="w-full bg-slate-50/50 border border-slate-200 rounded-xl py-3.5 px-3 text-center text-slate-800 placeholder-slate-300 text-sm font-medium focus:outline-none focus:border-brandBlue focus:bg-white transition-all shadow-sm"
                    >
                </div>
            </div>

            <div>
                <label for="installments" class="block text-sm font-bold text-slate-900 mb-2">Parcelamento</label>
                <div class="relative">
                    <!-- As opções são geradas pelo script conforme o valor da doação -->
                    <select
                        id="installments"
                        class="w-full bg-slate-50/50 border border-slate-200 rounded-xl py-3.5 pl-4 pr-10 text-slate-800 text-sm font-medium appearance-none focus:outline-none focus:border-brandBlue focus:bg-white transition-all shadow-sm cursor-pointer"
                    ></select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>

            <button
                type="submit"
                class="w-full bg-brandBlue hover:bg-brandBlueHover text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/25 transition-all duration-200 text-base sm:text-lg mt-2"
            >
                Finalizar Pagamento
            </button>
        </form>

        <div class="mt-6 bg-brandBlueLight/80 border border-blue-100 rounded-2xl p-4 flex items-start space-x-3.5">
            <div class="text-brandBlue text-2xl pt-0.5 flex-shrink-0">
                <i class="fa-shield-halved fa-solid"></i>
            </div>
            <div>
                <h4 class="font-bold text-slate-900 text-sm">Sua doação é segura</h4>
                <p class="text-slate-500 text-xs mt-0.5 leading-relaxed font-normal">
                    Seus dados estão protegidos com criptografia de ponta a ponta.
                </p>
            </div>
        </div>

        <div class="mt-5 bg-white border border-slate-100/80 rounded-2xl p-5 shadow-xl shadow-slate-200/50">
            <h3 class="font-extrabold text-slate-900 text-base mb-4">Resumo da doação</h3>

            <div class="space-y-2 text-xs sm:text-sm">
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-medium">Projeto</span>
                    <span class="text-slate-500 font-medium text-right" data-campo="projeto"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-medium">Data</span>
                    <span class="text-slate-500 font-medium text-right" data-campo="data"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-medium">Valor</span>
                    <span class="text-slate-500 font-medium text-right" data-campo="valor"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-medium">Forma de pagamento</span>
                    <span class="text-slate-500 font-medium text-right">Cartão</span>
                </div>
            </div>
        </div>

        <!-- Link Suporte WhatsApp -->
        <div class="mt-6 text-center">
            <a
                href="#"
                onclick="showToast('Iniciando atendimento via WhatsApp...', 'success'); return false;"
                class="inline-flex items-center justify-center text-xs sm:text-sm font-semibold text-slate-700 hover:text-slate-900 transition-colors space-x-1.5"
            >
                <i class="fa-whatsapp fa-brands text-green-500 text-base"></i>
                <span>Precisa de ajuda? Fale com nosso <span class="text-brandBlue underline decoration-1 underline-offset-2">suporte</span></span>
            </a>
        </div>

    </main>

    <script src="dadosProjetos.js"></script>
    <script src="pagamento.js"></script>
    <script>
        // Gera as opções de parcelamento a partir do valor da doação (parcela mínima de R$5,00)
        if (pagamentoValido) {
            const select = document.getElementById('installments');
            const maxParcelas = Math.min(12, Math.floor(valorPagamento / 5));

            for (let n = 1; n <= maxParcelas; n++) {
                const parcela = Math.floor((valorPagamento / n) * 100) / 100;
                const texto = n === 1
                    ? `À vista (${formatarMoeda(valorPagamento)})`
                    : `${n}x de ${formatarMoeda(parcela)} sem juros`;
                select.add(new Option(texto, n));
            }
        }

        function formatCardNumber(input) {
            let value = input.value.replace(/\D/g, '');
            value = value.replace(/(.{4})/g, '$1 ').trim();
            input.value = value;
        }

        function formatExpiry(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + ' / ' + value.substring(2, 4);
            }
            input.value = value;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.textContent = message;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-green-400';
            } else if (type === 'info') {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400';
            }

            toast.classList.remove('-translate-y-40', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-40', 'opacity-0');
            }, 3000);
        }

        function handleSubmit(e) {
            e.preventDefault();
            showToast('Pagamento processado com sucesso!', 'success');
            concluirPagamento('cartao', 2500);
        }
    </script>
</body>
</html>
